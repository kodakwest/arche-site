<?xml version="1.0" encoding="UTF-8"?>
<!-- Arche — Vertical Lockup
     Icon centered over wordmark. Use for social avatar, splash screen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" fill="none">
  <!-- Icon -->
  <g transform="translate(20, 2)">
    <path d="M4 24 L4 12 C4 4 20 4 20 12 L20 24"
          stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M4 16 L20 16" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="16" r="3" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.35"/>
    <circle cx="12" cy="16" r="1.5" fill="#22d3ee"/>
    <circle cx="12" cy="3" r="1.5" fill="#22d3ee"/>
  </g>

  <!-- Wordmark -->
  <text x="32" y="50" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif"
        font-size="14" font-weight="600" letter-spacing="0.08em"
        fill="#f2f0e8" text-anchor="middle" dominant-baseline="bottom">ARCHE</text>

  <!-- Tagline -->
  <text x="32" y="57" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif"
        font-size="4.5" font-weight="400" letter-spacing="0.15em"
        fill="#6b7280" text-anchor="middle" dominant-baseline="bottom">BUILD SECURE AGENT WORKFLOWS</text>
</svg>
